name: Update Profile Widget

on:
  schedule:
    # Runs once every day at 00:00 UTC (07:00 AM UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "widget_config.json"

jobs:
  update-widget:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Profile Widget SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_widget.py

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-widget.svg
          if git diff --staged --quiet; then
            echo "No changes in profile-widget.svg"
          else
            git commit -m "chore: update profile widget [skip ci]"
            git push
          fi
